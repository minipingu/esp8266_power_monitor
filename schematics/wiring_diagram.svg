<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="100%" height="100%" style="background:#0f172a; font-family: 'Segoe UI', Arial, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title & Legend -->
  <rect x="30" y="25" width="1540" height="70" rx="10" fill="#1e293b" filter="url(#shadow)" stroke="#334155" stroke-width="2"/>
  <text x="50" y="68" fill="#38bdf8" font-size="26" font-weight="bold">ESP8266 Multi-Rail Power Supply Monitor (12V/30A, 5V/20A, 3.3V/10A + DHT22)</text>
  <text x="1100" y="65" fill="#94a3b8" font-size="14">I2C: SCL=D1(GPIO5), SDA=D2(GPIO4) | DHT22: D5(GPIO14)</text>

  <!-- Wire Legend -->
  <g transform="translate(50, 105)">
    <rect width="1500" height="30" fill="#1e293b" rx="6" stroke="#334155"/>
    <circle cx="20" cy="15" r="7" fill="#eab308"/><text x="35" y="20" fill="#cbd5e1" font-size="13">12V Rail (Heavy 10-12 AWG)</text>
    <circle cx="260" cy="15" r="7" fill="#ef4444"/><text x="275" y="20" fill="#cbd5e1" font-size="13">5V Rail (Heavy 12-14 AWG / VCC)</text>
    <circle cx="530" cy="15" r="7" fill="#f97316"/><text x="545" y="20" fill="#cbd5e1" font-size="13">3.3V Rail (16-18 AWG / Logic)</text>
    <circle cx="780" cy="15" r="7" fill="#64748b"/><text x="795" y="20" fill="#cbd5e1" font-size="13">Common GND (Ground)</text>
    <circle cx="980" cy="15" r="7" fill="#06b6d4"/><text x="995" y="20" fill="#cbd5e1" font-size="13">I2C Bus (SCL/SDA)</text>
    <circle cx="1140" cy="15" r="7" fill="#22c55e"/><text x="1155" y="20" fill="#cbd5e1" font-size="13">Analog Signal</text>
    <circle cx="1300" cy="15" r="7" fill="#a855f7"/><text x="1315" y="20" fill="#cbd5e1" font-size="13">DHT22 OneWire Data</text>
  </g>

  <!-- SECTION 1: POWER SUPPLY INPUT (LEFT) -->
  <g transform="translate(50, 160)" filter="url(#shadow)">
    <rect width="220" height="420" rx="10" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
    <text x="20" y="35" fill="#f8fafc" font-size="18" font-weight="bold">ATX / DC POWER</text>
    <text x="20" y="55" fill="#94a3b8" font-size="12">Power Supply Source</text>

    <!-- Terminals -->
    <rect x="20" y="80" width="180" height="60" rx="6" fill="#0f172a" stroke="#eab308"/>
    <text x="35" y="110" fill="#eab308" font-size="16" font-weight="bold">+12V Rail</text>
    <text x="35" y="130" fill="#94a3b8" font-size="12">Max 30 Amperes</text>

    <rect x="20" y="160" width="180" height="60" rx="6" fill="#0f172a" stroke="#ef4444"/>
    <text x="35" y="190" fill="#ef4444" font-size="16" font-weight="bold">+5V Rail</text>
    <text x="35" y="210" fill="#94a3b8" font-size="12">Max 20 Amperes</text>

    <rect x="20" y="240" width="180" height="60" rx="6" fill="#0f172a" stroke="#f97316"/>
    <text x="35" y="270" fill="#f97316" font-size="16" font-weight="bold">+3.3V Rail</text>
    <text x="35" y="290" fill="#94a3b8" font-size="12">Max 10 Amperes</text>

    <rect x="20" y="320" width="180" height="60" rx="6" fill="#0f172a" stroke="#64748b"/>
    <text x="35" y="350" fill="#cbd5e1" font-size="16" font-weight="bold">COMMON GND</text>
    <text x="35" y="370" fill="#94a3b8" font-size="12">Star Ground Center</text>
  </g>

  <!-- SECTION 2: ACS712 CURRENT SENSORS (IN-LINE WITH LOADS) -->
  <!-- ACS712 30A (12V) -->
  <g transform="translate(340, 160)" filter="url(#shadow)">
    <rect width="220" height="120" rx="8" fill="#1e293b" stroke="#eab308" stroke-width="2"/>
    <text x="15" y="25" fill="#f8fafc" font-size="14" font-weight="bold">ACS712 - 30A Module</text>
    <text x="15" y="42" fill="#94a3b8" font-size="11">Sensitivity: 66 mV/A (12V Rail)</text>
    <rect x="15" y="55" width="50" height="50" rx="4" fill="#0284c7"/><text x="22" y="85" fill="#fff" font-size="11">IN+ | OUT</text>
    <text x="120" y="70" fill="#ef4444" font-size="11">VCC: 5V</text>
    <text x="120" y="88" fill="#cbd5e1" font-size="11">GND: GND</text>
    <text x="120" y="106" fill="#22c55e" font-size="12" font-weight="bold">OUT -> A1 (ADC1)</text>
  </g>

  <!-- ACS712 20A (5V) -->
  <g transform="translate(340, 310)" filter="url(#shadow)">
    <rect width="220" height="120" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <text x="15" y="25" fill="#f8fafc" font-size="14" font-weight="bold">ACS712 - 20A Module</text>
    <text x="15" y="42" fill="#94a3b8" font-size="11">Sensitivity: 100 mV/A (5V Rail)</text>
    <rect x="15" y="55" width="50" height="50" rx="4" fill="#0284c7"/><text x="22" y="85" fill="#fff" font-size="11">IN+ | OUT</text>
    <text x="120" y="70" fill="#ef4444" font-size="11">VCC: 5V</text>
    <text x="120" y="88" fill="#cbd5e1" font-size="11">GND: GND</text>
    <text x="120" y="106" fill="#22c55e" font-size="12" font-weight="bold">OUT -> A3 (ADC1)</text>
  </g>

  <!-- ACS712 20A (3.3V Rail, up to 10A) -->
  <g transform="translate(340, 460)" filter="url(#shadow)">
    <rect width="220" height="120" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="2"/>
    <text x="15" y="25" fill="#f8fafc" font-size="14" font-weight="bold">ACS712 - 20A Module</text>
    <text x="15" y="42" fill="#94a3b8" font-size="11">Sensitivity: 100 mV/A (3.3V / 10A)</text>
    <rect x="15" y="55" width="50" height="50" rx="4" fill="#0284c7"/><text x="22" y="85" fill="#fff" font-size="11">IN+ | OUT</text>
    <text x="120" y="70" fill="#ef4444" font-size="11">VCC: 5V</text>
    <text x="120" y="88" fill="#cbd5e1" font-size="11">GND: GND</text>
    <text x="120" y="106" fill="#22c55e" font-size="12" font-weight="bold">OUT -> A1 (ADC2)</text>
  </g>

  <!-- SECTION 3: VOLTAGE DIVIDER SENSORS (0-25V Range) -->
  <g transform="translate(340, 610)" filter="url(#shadow)">
    <rect width="220" height="220" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="15" y="25" fill="#f8fafc" font-size="14" font-weight="bold">3x Voltage Dividers</text>
    <text x="15" y="42" fill="#94a3b8" font-size="11">Ratio 5:1 (30kΩ / 7.5kΩ, 0-25V)</text>

    <!-- Div 12V -->
    <rect x="15" y="55" width="190" height="45" rx="4" fill="#0f172a" stroke="#eab308"/>
    <text x="25" y="75" fill="#eab308" font-size="12">12V In -> Signal (2.4V)</text>
    <text x="25" y="92" fill="#22c55e" font-size="11">Out -> A0 on ADC1 (0x48)</text>

    <!-- Div 5V -->
    <rect x="15" y="110" width="190" height="45" rx="4" fill="#0f172a" stroke="#ef4444"/>
    <text x="25" y="130" fill="#ef4444" font-size="12">5V In -> Signal (1.0V)</text>
    <text x="25" y="147" fill="#22c55e" font-size="11">Out -> A2 on ADC1 (0x48)</text>

    <!-- Div 3.3V -->
    <rect x="15" y="165" width="190" height="45" rx="4" fill="#0f172a" stroke="#f97316"/>
    <text x="25" y="185" fill="#f97316" font-size="12">3.3V In -> Signal (0.66V)</text>
    <text x="25" y="202" fill="#22c55e" font-size="11">Out -> A0 on ADC2 (0x49)</text>
  </g>

  <!-- SECTION 4: DUAL ADS1115 16-BIT ADC MODULES (CENTER) -->
  <!-- ADS1115 #1 (Address 0x48) -->
  <g transform="translate(640, 160)" filter="url(#shadow)">
    <rect width="280" height="300" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="35" rx="8" fill="#0891b2"/>
    <text x="15" y="24" fill="#fff" font-size="15" font-weight="bold">ADS1115 #1 (I2C: 0x48)</text>

    <!-- Pins -->
    <text x="20" y="65" fill="#ef4444" font-size="13">VDD  --> 5V Rail</text>
    <text x="20" y="90" fill="#cbd5e1" font-size="13">GND  --> Common GND</text>
    <text x="20" y="115" fill="#06b6d4" font-size="13">SCL  --> D1 (GPIO5)</text>
    <text x="20" y="140" fill="#06b6d4" font-size="13">SDA  --> D2 (GPIO4)</text>
    <text x="20" y="165" fill="#a855f7" font-size="13">ADDR --> GND (Sets Addr 0x48)</text>

    <line x1="15" y1="180" x2="265" y2="180" stroke="#334155" stroke-width="1"/>
    <text x="20" y="205" fill="#22c55e" font-size="13" font-weight="bold">A0: 12V Voltage Sense (0-2.4V)</text>
    <text x="20" y="230" fill="#22c55e" font-size="13" font-weight="bold">A1: 12V Current Sense (ACS-30A)</text>
    <text x="20" y="255" fill="#22c55e" font-size="13" font-weight="bold">A2: 5V Voltage Sense (0-1.0V)</text>
    <text x="20" y="280" fill="#22c55e" font-size="13" font-weight="bold">A3: 5V Current Sense (ACS-20A)</text>
  </g>

  <!-- ADS1115 #2 (Address 0x49) -->
  <g transform="translate(640, 500)" filter="url(#shadow)">
    <rect width="280" height="280" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2"/>
    <rect x="0" y="0" width="280" height="35" rx="8" fill="#0891b2"/>
    <text x="15" y="24" fill="#fff" font-size="15" font-weight="bold">ADS1115 #2 (I2C: 0x49)</text>

    <!-- Pins -->
    <text x="20" y="65" fill="#ef4444" font-size="13">VDD  --> 5V Rail</text>
    <text x="20" y="90" fill="#cbd5e1" font-size="13">GND  --> Common GND</text>
    <text x="20" y="115" fill="#06b6d4" font-size="13">SCL  --> D1 (GPIO5)</text>
    <text x="20" y="140" fill="#06b6d4" font-size="13">SDA  --> D2 (GPIO4)</text>
    <text x="20" y="165" fill="#a855f7" font-size="13">ADDR --> VDD (Sets Addr 0x49)</text>

    <line x1="15" y1="180" x2="265" y2="180" stroke="#334155" stroke-width="1"/>
    <text x="20" y="205" fill="#22c55e" font-size="13" font-weight="bold">A0: 3.3V Voltage Sense (0-0.66V)</text>
    <text x="20" y="230" fill="#22c55e" font-size="13" font-weight="bold">A1: 3.3V Current Sense (ACS-20A)</text>
    <text x="20" y="255" fill="#64748b" font-size="12">A2: Spare / Auxiliary Input</text>
    <text x="20" y="272" fill="#64748b" font-size="12">A3: Spare / Auxiliary Input</text>
  </g>

  <!-- SECTION 5: ESP8266 NODEMCU MICROCONTROLLER (RIGHT-CENTER) -->
  <g transform="translate(1000, 200)" filter="url(#shadow)">
    <rect width="270" height="480" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="3"/>
    <rect x="0" y="0" width="270" height="40" rx="10" fill="#1d4ed8"/>
    <text x="35" y="26" fill="#fff" font-size="16" font-weight="bold">NodeMCU ESP8266 (ESP-12E)</text>

    <!-- Wi-Fi Antenna -->
    <rect x="85" y="50" width="100" height="50" rx="4" fill="#334155" stroke="#64748b"/>
    <path d="M 105 85 Q 135 60 165 85 M 115 88 Q 135 72 155 88" stroke="#38bdf8" stroke-width="2" fill="none"/>
    <text x="110" y="96" fill="#94a3b8" font-size="10">Wi-Fi 802.11b/g/n</text>

    <!-- Pin Headers Left -->
    <g transform="translate(15, 120)">
      <circle cx="10" cy="15" r="5" fill="#3b82f6"/><text x="25" y="19" fill="#cbd5e1" font-size="12">A0 (ADC0)</text>
      <circle cx="10" cy="45" r="5" fill="#334155"/><text x="25" y="49" fill="#64748b" font-size="12">G / RSV</text>
      <circle cx="10" cy="75" r="5" fill="#334155"/><text x="25" y="79" fill="#64748b" font-size="12">VU</text>
      <circle cx="10" cy="105" r="5" fill="#06b6d4"/><text x="25" y="109" fill="#38bdf8" font-size="13" font-weight="bold">D1 (GPIO5) [SCL]</text>
      <circle cx="10" cy="135" r="5" fill="#06b6d4"/><text x="25" y="139" fill="#38bdf8" font-size="13" font-weight="bold">D2 (GPIO4) [SDA]</text>
      <circle cx="10" cy="165" r="5" fill="#334155"/><text x="25" y="169" fill="#64748b" font-size="12">D3 (GPIO0)</text>
      <circle cx="10" cy="195" r="5" fill="#334155"/><text x="25" y="199" fill="#64748b" font-size="12">D4 (GPIO2)</text>
      <circle cx="10" cy="225" r="5" fill="#334155"/><text x="25" y="229" fill="#cbd5e1" font-size="12">3V3 (Output)</text>
      <circle cx="10" cy="255" r="5" fill="#64748b"/><text x="25" y="259" fill="#cbd5e1" font-size="12">GND (Ground)</text>
    </g>

    <!-- Pin Headers Right -->
    <g transform="translate(150, 120)">
      <circle cx="105" cy="15" r="5" fill="#a855f7"/><text x="2" y="19" fill="#c084fc" font-size="13" font-weight="bold">D5 (GPIO14) [DHT]</text>
      <circle cx="105" cy="45" r="5" fill="#334155"/><text x="45" y="49" fill="#64748b" font-size="12">D6 (GPIO12)</text>
      <circle cx="105" cy="75" r="5" fill="#334155"/><text x="45" y="79" fill="#64748b" font-size="12">D7 (GPIO13)</text>
      <circle cx="105" cy="105" r="5" fill="#334155"/><text x="45" y="109" fill="#64748b" font-size="12">D8 (GPIO15)</text>
      <circle cx="105" cy="135" r="5" fill="#334155"/><text x="50" y="139" fill="#64748b" font-size="12">RX (GPIO3)</text>
      <circle cx="105" cy="165" r="5" fill="#334155"/><text x="50" y="169" fill="#64748b" font-size="12">TX (GPIO1)</text>
      <circle cx="105" cy="195" r="5" fill="#64748b"/><text x="65" y="199" fill="#cbd5e1" font-size="12">GND</text>
      <circle cx="105" cy="225" r="5" fill="#ef4444"/><text x="15" y="229" fill="#ef4444" font-size="13" font-weight="bold">VIN (5V Power In)</text>
    </g>

    <!-- USB Port -->
    <rect x="95" y="445" width="80" height="30" rx="3" fill="#64748b" stroke="#94a3b8"/>
    <text x="110" y="465" fill="#0f172a" font-size="11" font-weight="bold">MicroUSB</text>
  </g>

  <!-- SECTION 6: DHT22 SENSOR (TOP-RIGHT) -->
  <g transform="translate(1330, 200)" filter="url(#shadow)">
    <rect width="210" height="190" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="2"/>
    <rect x="0" y="0" width="210" height="32" rx="8" fill="#7e22ce"/>
    <text x="15" y="22" fill="#fff" font-size="14" font-weight="bold">DHT22 (AM2302) Sensor</text>
    <text x="15" y="50" fill="#94a3b8" font-size="11">Suhu (-40~80°C) & Kelembaban</text>

    <!-- Sensor Grille -->
    <rect x="25" y="65" width="70" height="85" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
    <line x1="35" y1="80" x2="85" y2="80" stroke="#94a3b8" stroke-width="2"/>
    <line x1="35" y1="95" x2="85" y2="95" stroke="#94a3b8" stroke-width="2"/>
    <line x1="35" y1="110" x2="85" y2="110" stroke="#94a3b8" stroke-width="2"/>
    <line x1="35" y1="125" x2="85" y2="125" stroke="#94a3b8" stroke-width="2"/>

    <g transform="translate(110, 75)">
      <text x="0" y="15" fill="#ef4444" font-size="12">1. VCC (3.3V/5V)</text>
      <text x="0" y="38" fill="#a855f7" font-size="12" font-weight="bold">2. DATA -> D5</text>
      <text x="0" y="60" fill="#64748b" font-size="11">3. NC (No Connect)</text>
      <text x="0" y="80" fill="#cbd5e1" font-size="12">4. GND -> GND</text>
    </g>
    <text x="15" y="172" fill="#e2e8f0" font-size="10">*Gunakan R 4.7kΩ-10kΩ pull-up jika sensor telanjang</text>
  </g>

  <!-- SECTION 7: LOADS / OUTPUT TEST TERMINALS (BOTTOM-RIGHT) -->
  <g transform="translate(1330, 440)" filter="url(#shadow)">
    <rect width="210" height="240" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="15" y="30" fill="#10b981" font-size="16" font-weight="bold">LOAD / BEBAN DC</text>
    <text x="15" y="48" fill="#94a3b8" font-size="11">Terminal Output ke Perangkat</text>

    <rect x="15" y="60" width="180" height="45" rx="6" fill="#0f172a" stroke="#eab308"/>
    <text x="25" y="82" fill="#eab308" font-size="13" font-weight="bold">Load 12V (Max 30A)</text>
    <text x="25" y="96" fill="#94a3b8" font-size="10">Dari pin OUT ACS712-30A</text>

    <rect x="15" y="115" width="180" height="45" rx="6" fill="#0f172a" stroke="#ef4444"/>
    <text x="25" y="137" fill="#ef4444" font-size="13" font-weight="bold">Load 5V (Max 20A)</text>
    <text x="25" y="151" fill="#94a3b8" font-size="10">Dari pin OUT ACS712-20A</text>

    <rect x="15" y="170" width="180" height="45" rx="6" fill="#0f172a" stroke="#f97316"/>
    <text x="25" y="192" fill="#f97316" font-size="13" font-weight="bold">Load 3.3V (Max 10A)</text>
    <text x="25" y="206" fill="#94a3b8" font-size="10">Dari pin OUT ACS712-20A</text>
  </g>

  <!-- WIRING BUS / ROUTING VISUAL LINES -->
  <!-- I2C Bus from ESP to ADS1115 modules -->
  <path d="M 1010 325 L 940 325 L 940 300 L 920 300" stroke="#06b6d4" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M 1010 355 L 950 355 L 950 635 L 920 635" stroke="#06b6d4" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- DHT22 line -->
  <path d="M 1270 215 L 1330 238" stroke="#a855f7" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- High Current Line 12V from PSU to ACS712-30A to Load -->
  <path d="M 200 270 L 340 220" stroke="#eab308" stroke-width="6" fill="none"/>
  <path d="M 405 240 L 405 130 L 1435 130 L 1435 500" stroke="#eab308" stroke-width="6" fill="none"/>

  <!-- High Current Line 5V from PSU to ACS712-20A to Load -->
  <path d="M 200 350 L 340 370" stroke="#ef4444" stroke-width="5" fill="none"/>
  <path d="M 405 390 L 415 390 L 415 145 L 1450 145 L 1450 555" stroke="#ef4444" stroke-width="5" fill="none"/>

  <!-- High Current Line 3.3V from PSU to ACS712-20A to Load -->
  <path d="M 200 430 L 340 520" stroke="#f97316" stroke-width="4" fill="none"/>
  <path d="M 405 540 L 425 540 L 425 450 L 1465 450 L 1465 610" stroke="#f97316" stroke-width="4" fill="none"/>

  <!-- Safety Warning and Notes Box -->
  <g transform="translate(50, 850)" filter="url(#shadow)">
    <rect width="1500" height="200" rx="10" fill="#1e293b" stroke="#e11d48" stroke-width="2"/>
    <text x="25" y="32" fill="#f43f5e" font-size="16" font-weight="bold">PERHATIAN KESELAMATAN & PETUNJUK INSTALASI ARUS TINGGI (30A & 20A):</text>
    <text x="25" y="65" fill="#e2e8f0" font-size="13">1. <tspan fill="#facc15" font-weight="bold">Kabel Beban Arus Tinggi:</tspan> Jalur 12V 30A wajib menggunakan kabel tembaga serabut minimal 10-12 AWG (3.3 - 5.2 mm²). Jalur 5V 20A minimal 12-14 AWG.</text>
    <text x="25" y="90" fill="#e2e8f0" font-size="13">2. <tspan fill="#facc15" font-weight="bold">Modul ACS712 30A:</tspan> Terminal screw block pada modul ACS712 harus dikencangkan sekuat mungkin dan disolder tebal pada trace PCB belakang untuk mencegah panas berlebih pada beban 30A kontinyu.</text>
    <text x="25" y="115" fill="#e2e8f0" font-size="13">3. <tspan fill="#facc15" font-weight="bold">Common Grounding (Penting!):</tspan> Hubungkan semua GND (ESP8266, ADS1115, Sensor Tegangan, DHT22, dan GND Power Supply) menjadi satu titik (Star Ground) agar tidak ada offset tegangan.</text>
    <text x="25" y="140" fill="#e2e8f0" font-size="13">4. <tspan fill="#facc15" font-weight="bold">I2C Multi-Module:</tspan> ADS1115 #1 pin ADDR dihubungkan ke GND (alamat I2C: 0x48). ADS1115 #2 pin ADDR dihubungkan ke VDD (alamat I2C: 0x49).</text>
    <text x="25" y="165" fill="#e2e8f0" font-size="13">5. <tspan fill="#facc15" font-weight="bold">Tegangan Operasional:</tspan> NodeMCU diberi input 5V pada pin VIN. ADS1115 dan ACS712 diberi 5V. Logika I2C ESP8266 3.3V aman membaca ADS1115 via open-drain I2C.</text>
  </g>
</svg>
